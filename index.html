<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The New World's Cookie Fruit & Veggie Stand</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-hover: #1b5e20;
            --text: #2c3e50;
            --text-light: #607d8b;
            --bg-market: url('NWFV.jpg');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-image: var(--bg-market);
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            z-index: 1;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 6px;
            font-size: 22px;
            font-weight: 700;
        }

        .sub-title {
            color: #d84315;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
        }

        p {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-group, .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        button {
            padding: 14px 20px;
            font-size: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-easy { background-color: #4caf50; color: white; }
        .btn-easy:hover { background-color: #388e3c; }

        .btn-medium { background-color: #ff9800; color: white; }
        .btn-medium:hover { background-color: #f57c00; }

        .btn-hard { background-color: #e53935; color: white; }
        .btn-hard:hover { background-color: #d32f2f; }

        .btn-action {
            background-color: #1976d2;
            color: white;
            margin-top: 15px;
            width: 100%;
        }

        .btn-qr {
            background-color: #673ab7;
            color: white;
            margin-top: 10px;
        }

        .quiz-box {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            height: 6px;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 17px;
            margin: 15px 0;
            font-weight: 600;
            line-height: 1.4;
        }

        .hint {
            font-style: italic;
            color: #555;
            margin-bottom: 20px;
            font-size: 13px;
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            text-align: left;
        }

        .answer-btn {
            background-color: #f8f9fa;
            color: var(--text);
            border: 2px solid #e9ecef;
            text-align: left;
            padding: 14px 18px;
        }

        .answer-btn.correct { background-color: #4caf50 !important; color: white !important; }
        .answer-btn.wrong { background-color: #ef5350 !important; color: white !important; }

        /* Modal QR Estilos */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 350px;
            width: 100%;
            text-align: center;
        }

        .qr-img {
            margin: 15px auto;
            display: block;
            border: 4px solid #2e7d32;
            border-radius: 10px;
            max-width: 100%;
            height: auto;
        }

        .url-input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Menú Principal -->
    <div id="menu">
        <h1>THE NEW WORLD'S</h1>
        <h1>FRUITS & VEGGIES</h1>
        <div class="sub-title">🍪 Budget: 10 Cookies Maximum 🍪</div>
        <p>Remember to speak in English with Cashiers!</p>
        <div class="btn-group">
            <button class="btn-easy" onclick="startQuiz('easy')">INITIAL (EASY)</button>
            <button class="btn-medium" onclick="startQuiz('medium')">INTERMEDIATE (MEDIUM)</button>
            <button class="btn-hard" onclick="startQuiz('hard')">ADVANCED (HARD)</button>
            <button class="btn-qr" onclick="openQR()">📱 Scan QR for Mobile</button>
        </div>
    </div>

    <!-- Quiz Box -->
    <div id="quiz" class="quiz-box">
        <h1 id="difficulty-title">Quiz</h1>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p>Question <span id="current-number">1</span> of 4</p>
        <div class="question-text" id="question">Loading...</div>
        <div class="hint" id="hint">Hint: ...</div>
        <div class="answers" id="answers-container"></div>
        <button class="btn-action" id="next-btn" onclick="nextQuestion()" style="display:none;">Next Question</button>
    </div>

    <!-- Results Box -->
    <div id="results" class="quiz-box">
        <h1>¡Shopping Completed!</h1>
        <div style="background:#f1f8e9; padding:20px; border-radius:12px; margin:20px 0;">
            <p style="margin-bottom: 5px;">Your Total Score:</p>
            <div style="font-size:32px; font-weight:800; color:var(--primary);" id="score-text">0 / 4</div>
        </div>
        <button class="btn-action" onclick="resetQuiz()">Play Again</button>
    </div>
</div>

<!-- Modal QR Code -->
<div id="qrModal" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--primary);">Mobile QR Code</h2>
        <p style="font-size:13px; margin-top:5px;">Scan this code with your mobile phone to play:</p>
        
        <img id="qrImage" class="qr-img" src="" alt="QR Code" width="180" height="180">
        
        <input type="text" id="urlInput" class="url-input" placeholder="Pega tu enlace web aquí..." oninput="updateQR(this.value)" style="display: none;">
        
        <button class="btn-action" onclick="closeQR()" style="margin-top:15px;">Cerrar</button>
    </div>
</div>

<script>
const bank = {
    easy: [
        // 1ª Opción CORRECTA en Inicial
        [
            { q: "How many cookies do 2 Apples (Red) cost in total?", h: "Hint: Check Flashcard", a: ["2 cookies", "3 cookies", "1 cookie"], c: "2 cookies" },
            { q: "How many cookies does 1 Lettuce (Green) cost?", h: "Hint: Check Flashcard", a: ["2 cookies", "1 cookie", "3 cookies"], c: "2 cookies" },
            { q: "TRICKY ITEM: 1 Tomato (Red) - Is a tomato a fruit or a vegetable?", h: "Hint: It has seeds inside.", a: ["Fruit", "Vegetable", "Neither"], c: "Fruit" },
            { q: "What is the TOTAL COST ?", h: "Hint: Budget is 10 Cookies maximum", a: ["9 Cookies", "10 Cookies", "8 Cookies"], c: "9 Cookies" }
        ],
        [
            { q: "How many cookies does 1 Coconut (Brown / White) cost?", h: "Hint: Check Flashcard", a: ["3 cookies", "2 cookies", "1 cookie"], c: "3 cookies" },
            { q: "You buy 2 Carrots (Orange). What is the total?", h: "Hint: Check Flashcard", a: ["2 cookies", "3 cookies", "4 cookies"], c: "2 cookies" },
            { q: "TRICKY ITEM: 1 Chocolate Cookie Card - Is a cookie a fruit or a vegetable?", h: "Hint: Do NOT buy this!", a: ["Do NOT buy this!", "Fruit", "Vegetable"], c: "Do NOT buy this!" },
            { q: "What is the TOTAL COST ?", h: "Hint: Budget is 10 Cookies maximum", a: ["7 Cookies", "8 Cookies", "9 Cookies"], c: "7 Cookies" }
        ],
        [
            { q: "You buy 1 Banana and 2 Apples (Red). How much do they cost in total?", h: "Hint: Check Flashcard", a: ["3 cookies", "2 cookies", "4 cookies"], c: "3 cookies" },
            { q: "What is the colour of a standard Banana on the stand?", h: "Hint: Check the flashcard color for bananas", a: ["Yellow", "Red", "Green"], c: "Yellow" },
            { q: "You buy 3 Potatoes (Brown/Yellow). How many cookies do they cost ?", h: "Hint: Basic multiplication", a: ["3 cookies", "2 cookies", "5 cookies"], c: "3 cookies" },
            { q: "How many colours of Apples are shown on the stand flashcard?", h: "Hint: Check Flashcards", a: ["Three colors", "One color", "Two colors"], c: "Three colors" }
        ],
        [
            { q: "When the cashier says 'Here you go!', what is the proper polite response?", h: "Hint: Basic shopping manners", a: ["Thank you!", "Hello!", "Good morning!"], c: "Thank you!" },
            { q: "You want to ask the price of a Carrot. What do you say?", h: "Hint: Basic shopping manners", a: ["How much is the carrot?", "Where is the carrot?", "Do you like carrots?"], c: "How much is the carrot?" },
            { q: "Is a Coconut classified as a Fruit or a Vegetable in your list?", h: "Hint: Check Flashcard", a: ["Fruit", "Vegetable", "Dairy"], c: "Fruit" },
            { q: "You buy 2 Lettuces. What is the total?", h: "Hint: Check Flashcard", a: ["4 cookies", "2 cookies", "3 cookies"], c: "4 cookies" }
        ]
    ],
    medium: [
        // 2ª Opción CORRECTA en Intermedio
        [
            { q: "You buy 1 Papaya, 1 Artichoke, and 2 Guavas. What is the subtotal?", h: "Hint: Check Flashcards", a: ["6 cookies", "8 cookies", "10 cookies"], c: "8 cookies" },
            { q: "TRICKY ITEM: What is Kohlrabi?", h: "Hint: Is this strange item a fruit or a cabbage relative?", a: ["Fruit", "Cabbage relative", "Underground nut"], c: "Cabbage relative" },
            { q: "You buy 2 Rambutans and 1 Okra. How many cookies do you spend?", h: "Hint: Check Flashcards", a: ["4 cookies", "5 cookies", "3 cookies"], c: "5 cookies" },
            { q: "What is the total cost of all the items?", h: "Hint: Reaches the maximum budget limit!", a: ["9 Cookies", "10 Cookies", "8 Cookies"], c: "10 Cookies" }
        ],
        [
            { q: "You buy 1 Artichoke and 2 Cabbages. What is the total?", h: "Hint: Check Flashcard", a: ["6 cookies", "5 cookies", "7 cookies"], c: "6 cookies" },
            { q: "What colour is the Kohlrabi listed in the flashcards?", h: "Hint: Check the vegetable attributes table", a: ["Bright orange", "Light green / Purple", "Deep blue"], c: "Light green / Purple" },
            { q: "You buy 1 Papaya and 3 Potatoes. What is your subtotal?", h: "Hint: Check Flashcard", a: ["4 cookies", "5 cookies", "6 cookies"], c: "5 cookies" },
            { q: "Complete the cashier dialogue: 'It costs ___ cookie(s).'", h: "Hint: Fill in the blank ", a: ["many", "___", "some"], c: "___" }
        ],
        [
            { q: "Which of these items is strictly a Vegetable on your list?", h: "Hint: Look at the carrot, papaya, or banana", a: ["Papaya", "Carrot", "Banana"], c: "Carrot" },
            { q: "You have a budget of 10 cookies. You spend 8 cookies. How many cookies do you have left?", h: "Hint: Basic Subtraction", a: ["1 cookie", "2 cookies", "3 cookies"], c: "2 cookies" },
            { q: "What is the Spanish translation for 'Artichoke'?", h: "Hint: Look up in a dictionary", a: ["Nabo", "Alcaucil", "Lechuga"], c: "Alcaucil" },
            { q: "You buy 2 Guavas and 1 Okra. Does this fit your 10 cookie budget?", h: "Hint: Check Flashcards", a: ["No, it is too expensive", "Yes, it is under budget", "Exact maximum limit"], c: "Yes, it is under budget" }
        ]
    ],
    hard: [
        // 3ª Opción CORRECTA en Avanzado
        [
            { q: "Which item matches this description: '1 Tropical Star-Shaped Fruit' ?", h: "Hint: Check Flashcards", a: ["Dragon Fruit", "Passion Fruit", "Starfruit"], c: "Starfruit" },
            { q: "TRICKY ITEM: Bitter Melon has 'melon' in the name... is it a sweet fruit or a bitter vegetable?", h: "Hint: Check Flashcard", a: ["Sweet fruit", "Dairy item", "Bitter vegetable"], c: "Bitter vegetable" },
            { q: "Find a 'Fruit disguised as a Veggie'.", h: "Hint: Tomato, Okra, or Bitter Melon!", a: ["Cabbage", "Celery", "Okra"], c: "Okra" },
            { q: "What is the total cost of List (Dragon Fruit, Passion Fruit, Leafy Green, Disguised Fruit)?", h: "Hint: Check Flashcards", a: ["10 Cookies", "8 Cookies", "9 Cookies"], c: "9 Cookies" }
        ],
        [
            { q: "What colours are available for the Passion Fruit in the flashcards?", h: "Hint: Check the dual-color entry for Maracuyá", a: ["Red / Green", "Pink / White", "Purple / Yellow"], c: "Purple / Yellow" },
            { q: "Which fruit has a hairy or spiky red skin texture with a white inside?", h: "Hint: Tropical fruit", a: ["Starfruit", "Papaya", "Rambutan"], c: "Rambutan" },
            { q: "TRICKY MATH: You buy 1 Dragon Fruit, 1 Starfruit, and 2 Guavas. Do you exceed the 10 cookie budget?", h: "Hint: Check Flashcards", a: ["Yes, 11 cookies total", "Exact 10 cookies limit", "No, 9 cookies total (Safe!)"], c: "No, 9 cookies total (Safe!)" },
            { q: "What is the Spanish name for 'Bitter melon'?", h: "Hint: look up in a dictionary", a: ["Fruta de la pasión", "Alcaucil", "Melón amargo chino"], c: "Melón amargo chino" }
        ],
        [
            { q: "Which vegetable features multiple colour varieties including purple, blue, pink, and red in your flashcard image?", h: "Hint: The versatile underground crop", a: ["Lettuce", "Kohlrabi", "Potato"], c: "Potato" },
            { q: "When interacting with the cashier, how do you ask about the price in English?", h: "Hint: Basic shopping manners", a: ["How many cookies you have?", "Is this a fruit?", "How much is the...?"], c: "How much is the...?" },
            { q: "Dragon Fruit skin colour options in the flashcard are...", h: "Hint: Check Flashcard", a: ["Yellow / Blue", "Brown / Green", "Pink / White"], c: "Pink / White" },
            { q: "If you combine 1 Kohlrabi, 1 Artichoke, and 1 Bitter Melon, how many total items are you purchasing?", h: "Hint: Basic Addition", a: ["4 items", "2 items", "3 items"], c: "3 items" }
        ]
    ]
};

let currentQuestions = [];
let currentIdx = 0;
let score = 0;

function startQuiz(difficulty) {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('quiz').style.display = 'block';
   
    let titleText = "";
    if(difficulty === 'easy') {
        let randomListIndex = Math.floor(Math.random() * bank.easy.length);
        currentQuestions = bank.easy[randomListIndex];
        titleText = "INITIAL LEVEL ";
    } else if(difficulty === 'medium') {
        let randomListIndex = Math.floor(Math.random() * bank.medium.length);
        currentQuestions = bank.medium[randomListIndex];
        titleText = "INTERMEDIATE LEVEL ";
    } else if(difficulty === 'hard') {
        let randomListIndex = Math.floor(Math.random() * bank.hard.length);
        currentQuestions = bank.hard[randomListIndex];
        titleText = "ADVANCED LEVEL ";
    }
   
    document.getElementById('difficulty-title').innerText = titleText;
    currentIdx = 0;
    score = 0;
    showQuestion();
}

function showQuestion() {
    document.getElementById('next-btn').style.display = 'none';
    let qData = currentQuestions[currentIdx];
   
    document.getElementById('current-number').innerText = currentIdx + 1;
    document.getElementById('question').innerText = qData.q;
    document.getElementById('hint').innerText = qData.h;
   
    const progressPercent = ((currentIdx + 1) / currentQuestions.length) * 100;
    document.getElementById('progress-bar').style.width = `${progressPercent}%`;
   
    let answersContainer = document.getElementById('answers-container');
    answersContainer.innerHTML = '';
   
    qData.a.forEach(ans => {
        let btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerText = ans;
        btn.onclick = () => selectAnswer(btn, ans, qData.c);
        answersContainer.appendChild(btn);
    });
}

function selectAnswer(btn, selected, correct) {
    let buttons = document.querySelectorAll('.answer-btn');
    buttons.forEach(b => b.disabled = true);
   
    if (selected === correct) {
        btn.classList.add('correct');
        score++;
    } else {
        btn.classList.add('wrong');
        buttons.forEach(b => {
            if (b.innerText === correct) b.classList.add('correct');
        });
    }
    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    currentIdx++;
    if (currentIdx < currentQuestions.length) {
        showQuestion();
    } else {
        document.getElementById('quiz').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        document.getElementById('score-text').innerText = `${score} / ${currentQuestions.length}`;
    }
}

function resetQuiz() {
    document.getElementById('results').style.display = 'none';
    document.getElementById('menu').style.display = 'block';
}

/* Lógica del Código QR */
function openQR() {
    let currentURL = window.location.href;
    if (currentURL.startsWith('file://')) {
        currentURL = "https://catman2023.github.io/COOKIES_FRUITS_VEGGIES/index.html"; 
    }
    document.getElementById('urlInput').value = currentURL;
    updateQR(currentURL);
    document.getElementById('qrModal').style.display = 'flex';
}

function updateQR(text) {
    if(!text) text = "https://catman2023.github.io/COOKIES_FRUITS_VEGGIES/index.html";
    let qrApi = "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" + encodeURIComponent(text);
    document.getElementById('qrImage').src = qrApi;
}

function closeQR() {
    document.getElementById('qrModal').style.display = 'none';
}
</script>
</body>
</html>
