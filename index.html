<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The New World's Cookie Fruit & Veggie Stand</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-hover: #1b5e20;
            --text: #2c3e50;
            --text-light: #607d8b;
            --bg-market: url('NWFV.jpg');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-image: var(--bg-market);
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 520px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            z-index: 1;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 6px;
            font-size: 24px;
            font-weight: 700;
        }

        .sub-title {
            color: #d84315;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
        }

        p {
            color: var(--text-light);
            font-size: 15px;
            margin-bottom: 20px;
        }

        .btn-group, .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        button {
            padding: 14px 20px;
            font-size: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-easy { background-color: #4caf50; color: white; }
        .btn-easy:hover { background-color: #388e3c; }

        .btn-medium { background-color: #ff9800; color: white; }
        .btn-medium:hover { background-color: #f57c00; }

        .btn-hard { background-color: #e53935; color: white; }
        .btn-hard:hover { background-color: #d32f2f; }

        .btn-action {
            background-color: #1976d2;
            color: white;
            margin-top: 15px;
            width: 100%;
        }

        .btn-qr {
            background-color: #673ab7;
            color: white;
            margin-top: 10px;
        }

        .quiz-box {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            height: 6px;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 18px;
            margin: 15px 0;
            font-weight: 600;
            line-height: 1.4;
        }

        .hint {
            font-style: italic;
            color: #555;
            margin-bottom: 20px;
            font-size: 14px;
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            text-align: left;
        }

        .answer-btn {
            background-color: #f8f9fa;
            color: var(--text);
            border: 2px solid #e9ecef;
            text-align: left;
            padding: 14px 18px;
        }

        .answer-btn.correct { background-color: #4caf50 !important; color: white !important; }
        .answer-btn.wrong { background-color: #ef5350 !important; color: white !important; }

        /* Modal QR Estilos */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 350px;
            width: 90%;
            text-align: center;
        }

        .qr-img {
            margin: 15px auto;
            display: block;
            border: 4px solid #2e7d32;
            border-radius: 10px;
        }

        .url-input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Menú Principal -->
    <div id="menu">
        <h1>THE NEW WORLD'S</h1>
        <h1>FRUITS & VEGGIES</h1>
        <div class="sub-title">🍪 Budget: 10 Cookies Maximum 🍪</div>
        <p>Remember to speak in English with Cashiers!</p>
        <div class="btn-group">
            <button class="btn-easy" onclick="startQuiz('easy')">INITIAL (EASY)</button>
            <button class="btn-medium" onclick="startQuiz('medium')">INTERMEDIATE (MEDIUM)</button>
            <button class="btn-hard" onclick="startQuiz('hard')">ADVANCED (HARD)</button>
            <button class="btn-qr" onclick="openQR()">📱 Scan QR for Mobile</button>
        </div>
    </div>

    <!-- Quiz Box -->
    <div id="quiz" class="quiz-box">
        <h1 id="difficulty-title">Quiz</h1>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p>Question <span id="current-number">1</span> of 4</p>
        <div class="question-text" id="question">Loading...</div>
        <div class="hint" id="hint">Hint: ...</div>
        <div class="answers" id="answers-container"></div>
        <button class="btn-action" id="next-btn" onclick="nextQuestion()" style="display:none;">Next Question</button>
    </div>

    <!-- Results Box -->
    <div id="results" class="quiz-box">
        <h1>¡Shopping Completed!</h1>
        <div style="background:#f1f8e9; padding:20px; border-radius:12px; margin:20px 0;">
            <p style="margin-bottom: 5px;">Your Total Score:</p>
            <div style="font-size:32px; font-weight:800; color:var(--primary);" id="score-text">0 / 4</div>
        </div>
        <button class="btn-action" onclick="resetQuiz()">Play Again</button>
    </div>
</div>

<!-- Modal QR Code -->
<div id="qrModal" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--primary);">Mobile QR Code</h2>
        <p style="font-size:13px; margin-top:5px;">Escanea este código con tu celular para jugar:</p>
        
        <img id="qrImage" class="qr-img" src="" alt="QR Code" width="180" height="180">
        
        <input type="text" id="urlInput" class="url-input" placeholder="Pega tu enlace web aquí..." oninput="updateQR(this.value)">
        
        <button class="btn-action" onclick="closeQR()" style="margin-top:15px;">Cerrar</button>
    </div>
</div>

<script>
const bank = {
    easy: [
        [
            { q: "LIST 1: How many cookies do 2 Apples (Red) cost in total?", h: "Pista: 1 cookie each", a: ["2 cookies", "3 cookies", "1 cookie"], c: "2 cookies" },
            { q: "LIST 1: How many cookies does 1 Lettuce (Green) cost?", h: "Pista: Check List 1 items", a: ["2 cookies", "1 cookie", "3 cookies"], c: "2 cookies" },
            { q: "LIST 1: TRICKY ITEM: 1 Tomato (Red) - Is a tomato a fruit or a vegetable?", h: "Pista: It costs 2 cookies and has seeds inside.", a: ["Fruit", "Vegetable", "Neither"], c: "Fruit" },
            { q: "LIST 1: What is the TOTAL COST for List 1?", h: "Pista: Budget is 10 Cookies maximum", a: ["9 Cookies", "10 Cookies", "8 Cookies"], c: "9 Cookies" }
        ],
        [
            { q: "LIST 2: How many cookies does 1 Coconut (Brown / White) cost?", h: "Pista: Initial Level List 2", a: ["3 cookies", "2 cookies", "1 cookie"], c: "3 cookies" },
            { q: "LIST 2: You buy 2 Carrots (Orange) at 1 cookie each. What is the total?", h: "Pista: Carrots cost 1 cookie each", a: ["2 cookies", "3 cookies", "4 cookies"], c: "2 cookies" },
            { q: "LIST 2: TRICKY ITEM: 1 Chocolate Cookie Card - Is a cookie a fruit or a vegetable?", h: "Pista: Do NOT buy this!", a: ["Do NOT buy this!", "Fruit", "Vegetable"], c: "Do NOT buy this!" },
            { q: "LIST 2: What is the TOTAL COST for List 2?", h: "Pista: Budget is 10 Cookies maximum", a: ["7 Cookies", "8 Cookies", "9 Cookies"], c: "7 Cookies" }
        ]
    ],
    medium: [
        [
            { q: "INTERMEDIATE: You buy 1 Papaya (2 cookies), 1 Artichoke (2 cookies), and 2 Guavas (2 cookies each). What is the subtotal?", h: "Pista: Intermediate Level List 3", a: ["8 cookies", "6 cookies", "10 cookies"], c: "8 cookies" },
            { q: "INTERMEDIATE: TRICKY ITEM: What is Kohlrabi?", h: "Pista: Is this strange item a fruit or a cabbage relative?", a: ["Cabbage relative", "Fruit", "Underground nut"], c: "Cabbage relative" },
            { q: "INTERMEDIATE: You buy 2 Rambutans (2 cookies each) and 1 Okra (1 cookie). How many cookies do you spend?", h: "Pista: Intermediate Level List 4", a: ["5 cookies", "4 cookies", "3 cookies"], c: "5 cookies" },
            { q: "INTERMEDIATE: What is the total cost of List 3?", h: "Pista: Reaches the maximum budget limit!", a: ["10 Cookies", "9 Cookies", "8 Cookies"], c: "10 Cookies" }
        ]
    ],
    hard: [
        [
            { q: "ADVANCED: Which item matches this description: '1 Tropical Star-Shaped Fruit' (2 cookies)?", h: "Pista: Advanced Level List 5", a: ["Starfruit", "Dragon Fruit", "Passion Fruit"], c: "Starfruit" },
            { q: "ADVANCED: TRICKY ITEM: Bitter Melon has 'melon' in the name... is it a sweet fruit or a bitter vegetable?", h: "Pista: Advanced Level List 5", a: ["Bitter vegetable", "Sweet fruit", "Dairy item"], c: "Bitter vegetable" },
            { q: "ADVANCED: Find a 'Fruit disguised as a Veggie' on the stand for List 6.", h: "Pista: List 6 hints: Tomato, Okra, or Bitter Melon!", a: ["Okra", "Cabbage", "Celery"], c: "Okra" },
            { q: "ADVANCED: What is the total cost of List 6 (Dragon Fruit, Passion Fruit, Leafy Green, Disguised Fruit)?", h: "Pista: 3 + 2 + 2 + 2 cookies", a: ["9 Cookies", "10 Cookies", "8 Cookies"], c: "9 Cookies" }
        ]
    ]
};

let currentQuestions = [];
let currentIdx = 0;
let score = 0;

function startQuiz(difficulty) {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('quiz').style.display = 'block';
   
    let titleText = "";
    if(difficulty === 'easy') {
        let randomListIndex = Math.floor(Math.random() * bank.easy.length);
        currentQuestions = bank.easy[randomListIndex];
        titleText = "INITIAL LEVEL (List " + (randomListIndex + 1) + ")";
    } else if(difficulty === 'medium') {
        currentQuestions = bank.medium[0];
        titleText = "INTERMEDIATE LEVEL";
    } else if(difficulty === 'hard') {
        currentQuestions = bank.hard[0];
        titleText = "ADVANCED LEVEL";
    }
   
    document.getElementById('difficulty-title').innerText = titleText;
    currentIdx = 0;
    score = 0;
    showQuestion();
}

function showQuestion() {
    document.getElementById('next-btn').style.display = 'none';
    let qData = currentQuestions[currentIdx];
   
    document.getElementById('current-number').innerText = currentIdx + 1;
    document.getElementById('question').innerText = qData.q;
    document.getElementById('hint').innerText = qData.h;
   
    const progressPercent = ((currentIdx + 1) / currentQuestions.length) * 100;
    document.getElementById('progress-bar').style.width = `${progressPercent}%`;
   
    let answersContainer = document.getElementById('answers-container');
    answersContainer.innerHTML = '';
   
    qData.a.forEach(ans => {
        let btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerText = ans;
        btn.onclick = () => selectAnswer(btn, ans, qData.c);
        answersContainer.appendChild(btn);
    });
}

function selectAnswer(btn, selected, correct) {
    let buttons = document.querySelectorAll('.answer-btn');
    buttons.forEach(b => b.disabled = true);
   
    if (selected === correct) {
        btn.classList.add('correct');
        score++;
    } else {
        btn.classList.add('wrong');
        buttons.forEach(b => {
            if (b.innerText === correct) b.classList.add('correct');
        });
    }
    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    currentIdx++;
    if (currentIdx < currentQuestions.length) {
        showQuestion();
    } else {
        document.getElementById('quiz').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        document.getElementById('score-text').innerText = `${score} / ${currentQuestions.length}`;
    }
}

function resetQuiz() {
    document.getElementById('results').style.display = 'none';
    document.getElementById('menu').style.display = 'block';
}

/* Lógica del Código QR */
function openQR() {
    let currentURL = window.location.href;
    if (currentURL.startsWith('file://')) {
        currentURL = "https://catman2023.github.io/COOKIES_FRUITS_VEGGIES/index.html"; 
    }
    document.getElementById('urlInput').value = currentURL;
    updateQR(currentURL);
    document.getElementById('qrModal').style.display = 'flex';
}

function updateQR(text) {
    if(!text) text = "https://catman2023.github.io/COOKIES_FRUITS_VEGGIES/index.html";
    let qrApi = "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" + encodeURIComponent(text);
    document.getElementById('qrImage').src = qrApi;
}

function closeQR() {
    document.getElementById('qrModal').style.display = 'none';
}
</script>
</body>
</html>
